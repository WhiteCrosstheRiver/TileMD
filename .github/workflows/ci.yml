name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            ninja-build \
            python3 \
            python3-pip
          python3 -m pip install --no-cache-dir "cmake>=3.24" "clang-format==22.1.8"
      - name: Checkout
        uses: actions/checkout@v4
      - name: CPU check
        run: bash scripts/check.sh
